<style>
text{font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:14px;fill:#cccccc;white-space:pre}
.txt{fill:#cccccc}
.dim{fill:#6e7681}
.ok{fill:#3fb950;font-weight:bold}
.fail{fill:#f85149;font-weight:bold}
.skip{fill:#d29922;font-weight:bold}
.tab{font-family:"Segoe UI",system-ui,sans-serif;font-size:12px;fill:#ffffff}
.icon{font-family:Consolas,monospace;font-size:6.5px;fill:#bdbdbd;font-weight:bold}
.status{fill:#9d9d9d;font-size:12px}
@keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-616px)}}
.feed{animation:scroll 26.0s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{transform-origin:730px 336px;animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){.feed,.dot,.spinner{animation:none}}
</style>
